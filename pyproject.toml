[project]
name = "telecom-etl-pyspark"
version = "0.1.0"
description = "Incremental PySpark ETL for telecom CDRs: CDC into SCD2, late data, idempotent reruns, data quality gate"
requires-python = ">=3.10"
dependencies = ["pyspark>=4.0,<5"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
